# EXERCISE 2 — a Service with the wrong selector.
#
# The Pods have the label "app: working-api".
# The Service looks for the label "app: wrong-label".
# No Pod matches, therefore the Service has no endpoint.
#
#   kubectl apply -f troubleshooting/broken-service.yaml
#   kubectl get svc -n stockroom broken-service
#   kubectl get endpoints -n stockroom broken-service     # the list is empty
#   kubectl get pods -n stockroom --show-labels
#
# The lesson: a Service finds the Pods with labels. No label match gives no
# endpoint, and no endpoint gives no traffic.
#
# The correction: change the selector to "app: working-api".
#   kubectl delete -f troubleshooting/broken-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: working-api
  namespace: stockroom
  labels:
    app: working-api
    exercise: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: working-api
  template:
    metadata:
      labels:
        app: working-api
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: broken-service
  namespace: stockroom
  labels:
    exercise: "2"
spec:
  type: ClusterIP
  selector:
    # ERROR: no Pod has this label.
    app: wrong-label
  ports:
    - port: 80
      targetPort: 80
