# ---------------------------------------------------------------------------
# StockRoom CI/CD pipeline
#
# 1. test     pytest and the frontend build
# 2. images   build both images, scan them with Trivy, push them to GHCR
# 3. gitops   write the new image tag into the Helm values; Argo CD deploys it
#
# The image tag is always the full Git commit SHA.
# ---------------------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one run changes the Helm values at a time.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockroom-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockroom-frontend
  # Pinned to the version used for the local scans in docs/SECURITY.md.
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  # ------------------------------------------------------------------ 1
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -v

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ------------------------------------------------------------------ 2
  images:
    name: Build, scan and push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE:$GITHUB_SHA" ./backend

      - name: Build frontend image
        run: docker build -t "$FRONTEND_IMAGE:$GITHUB_SHA" ./frontend

      # A fixable HIGH or CRITICAL CVE gives exit code 1 and stops the job
      # before the push, so a vulnerable image never reaches the registry.
      - name: Trivy scan backend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$BACKEND_IMAGE:$GITHUB_SHA"

      - name: Trivy scan frontend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$FRONTEND_IMAGE:$GITHUB_SHA"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"

      - name: Write run summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Images for commit \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`$BACKEND_IMAGE\` | \`$GITHUB_SHA\` |"
            echo "| \`$FRONTEND_IMAGE\` | \`$GITHUB_SHA\` |"
            echo ""
            echo "Both images passed Trivy (no fixable HIGH or CRITICAL CVE)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ 3
  gitops:
    name: Update Helm image tag for Argo CD
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # yq edits the two image tags by their YAML path, so the PostgreSQL
      # image tag in the same file is never touched.
      - name: Set the new image tag in values.yaml
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' \
            helm/stockroom/values.yaml
          git diff --stat

      - name: Commit and push the new tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/stockroom/values.yaml
          git commit -m "deploy: set image tag to ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
