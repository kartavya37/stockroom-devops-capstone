# The values for the kube-prometheus-stack chart.
# This chart installs Prometheus, Grafana, Alertmanager and the operator.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f monitoring/prometheus-values.yaml

fullnameOverride: monitoring

prometheus:
  prometheusSpec:
    retention: 6h
    # An empty selector lets Prometheus read every ServiceMonitor in the
    # cluster. Without this value, Prometheus reads only its own objects.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

grafana:
  enabled: true
  # Change this password. Do not use this value in production.
  adminPassword: stockroom-admin
  service:
    type: ClusterIP
  defaultDashboardsEnabled: true
  # The sidecar loads the StockRoom dashboard ConfigMap from the Helm chart.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# The project has no alert rules, so Alertmanager is not necessary.
alertmanager:
  enabled: false

# The classroom cluster is small. These components are not necessary.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
