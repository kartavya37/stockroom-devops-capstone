# The values for a local cluster (Minikube). Argo CD also uses this file.
#   helm upgrade --install stockroom ./helm/stockroom \
#     -n stockroom --create-namespace -f helm/stockroom/values-dev.yaml
#
# This file does not set an image tag. The tag comes from values.yaml, where
# the pipeline writes the commit SHA.

backend:
  replicaCount: 2

frontend:
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  host: stockroom.local

serviceMonitor:
  enabled: true

grafanaDashboard:
  enabled: true

postgres:
  persistence:
    enabled: true
    size: 1Gi
