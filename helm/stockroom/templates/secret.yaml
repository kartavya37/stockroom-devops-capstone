# The database connection string. The backend reads it as an environment variable.
# A real project uses an external secret store, for example AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockroom.secretName" . }}
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "stockroom.databaseUrl" . | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
