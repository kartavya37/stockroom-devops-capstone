apiVersion: v1
kind: Service
metadata:
  name: {{ include "stockroom.fullname" . }}-backend
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "stockroom.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
# The Nginx configuration in the frontend image uses the name "backend".
# This alias makes that name available inside the namespace.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "stockroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-alias
spec:
  type: ExternalName
  externalName: {{ include "stockroom.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local
  ports:
    - name: http
      port: 8000
