# The default values of the StockRoom chart.
# The pipeline changes the image repository and the image tag.

nameOverride: ""
fullnameOverride: ""

namespace: stockroom

# ------------------------------------------------------------------ backend
backend:
  image:
    repository: ghcr.io/kartavya37/stockroom-devops-capstone-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  # The HPA needs the resource requests.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_NAME: StockRoom
    APP_VERSION: "1.0.0"

# ----------------------------------------------------------------- frontend
frontend:
  image:
    repository: ghcr.io/kartavya37/stockroom-devops-capstone-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ----------------------------------------------------------------- database
# PostgreSQL operates inside the cluster for the classroom demonstration.
# Production uses a managed database such as Amazon RDS.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: stockroom
    password: stockroom
    database: stockroom
  service:
    port: 5432
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------ ingress
ingress:
  enabled: false
  className: nginx
  host: stockroom.local
  annotations: {}
  # The Ingress sends / to the frontend and /api to the backend.

# ---------------------------------------------------------------------- HPA
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

# --------------------------------------------------------------- monitoring
serviceMonitor:
  enabled: false
  # The label must match the Prometheus Operator selector.
  labels:
    release: monitoring
  interval: 15s
  path: /metrics

imagePullSecrets: []
