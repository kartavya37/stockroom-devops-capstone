# The default values of the StockRoom chart.
# The pipeline job "gitops" writes the commit SHA into backend.image.tag and
# frontend.image.tag after each successful build. Argo CD then deploys it.

nameOverride: ""
fullnameOverride: ""
namespace: stockroom
# ------------------------------------------------------------------ backend
backend:
  image:
    repository: ghcr.io/kartavya37/stockroom-backend
    tag: "38c21688ed71f8223fb20195dcbbbc8a30848932"
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  # The scheduler uses the requests to place the Pods.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    APP_NAME: StockRoom
    APP_VERSION: "1.0.0"
# ----------------------------------------------------------------- frontend
frontend:
  image:
    repository: ghcr.io/kartavya37/stockroom-frontend
    tag: "38c21688ed71f8223fb20195dcbbbc8a30848932"
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
# ----------------------------------------------------------------- database
# PostgreSQL operates inside the cluster for the classroom demonstration.
# Production uses a managed database such as Amazon RDS.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: stockroom
    password: stockroom
    database: stockroom
  service:
    port: 5432
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
# ------------------------------------------------------------------ ingress
ingress:
  enabled: false
  className: nginx
  host: stockroom.local
  annotations: {}
  # The Ingress sends / to the frontend and /api to the backend.
  # An empty host makes the rule match every host name.
# --------------------------------------------------------------- monitoring
serviceMonitor:
  enabled: false
  # The label must match the Prometheus Operator selector.
  labels:
    release: monitoring
  interval: 15s
  path: /metrics
# A ConfigMap with the Grafana dashboard. The Grafana sidecar of
# kube-prometheus-stack loads every ConfigMap that has this label.
grafanaDashboard:
  enabled: false
  label: grafana_dashboard
  labelValue: "1"
imagePullSecrets: []
