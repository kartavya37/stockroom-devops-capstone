# Nginx sends the static files and gives every /api request to the backend.
# The browser does not need the internal name of the backend.
#
# The name "backend" must resolve inside the container network.
#  - Docker Compose: the service has the name "backend".
#  - Kubernetes: the chart makes an ExternalName Service with the name
#    "backend". The Ingress also sends /api to the backend directly.

upstream stockroom_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The React application uses one page. Every unknown path gives index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://stockroom_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "frontend ok\n";
    }
}
